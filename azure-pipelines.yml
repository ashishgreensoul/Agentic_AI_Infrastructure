trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: Agentic-AI-POOL

variables:
  terraformVersion: '1.14.0'
  workingDirectory: 'environments/dev'

stages:

# ============================================================
# STAGE 1 - TERRAFORM CI
# ============================================================

- stage: Terraform_CI
  displayName: 'Terraform CI'

  jobs:
  - job: Validate
    displayName: 'Terraform Validate'

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: $(terraformVersion)

    # --------------------------------------------------------
    # Terraform Format
    # --------------------------------------------------------

    - powershell: |

        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        Write-Host "=========================================="
        Write-Host "Terraform Format Check"
        Write-Host "=========================================="

        terraform fmt -check -recursive

      displayName: 'Terraform Format Check'

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - powershell: |

        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        Write-Host "=========================================="
        Write-Host "Terraform Init"
        Write-Host "=========================================="

        terraform init -backend=false

      displayName: 'Terraform Init'

    # --------------------------------------------------------
    # Terraform Validate
    # --------------------------------------------------------

    - powershell: |

        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        Write-Host "=========================================="
        Write-Host "Terraform Validate"
        Write-Host "=========================================="

        terraform validate

      displayName: 'Terraform Validate'


# ============================================================
# STAGE 2 - SECURITY SCAN
# ============================================================

- stage: Security_Scan
  displayName: 'Terraform Security Scan'

  dependsOn:
    - Terraform_CI

  condition: succeeded()

  jobs:
  - job: Security
    displayName: 'Terraform Security'

    steps:

    - checkout: self


    # ========================================================
    # INSTALL TFLINT
    # ========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "Installing TFLint"
        Write-Host "=========================================="

        $release = Invoke-RestMethod `
          -Uri "https://api.github.com/repos/terraform-linters/tflint/releases/latest"

        $asset = $release.assets |
          Where-Object {
            $_.name -eq "tflint_windows_amd64.zip"
          } |
          Select-Object -First 1

        if (-not $asset) {
          throw "TFLint Windows AMD64 package not found"
        }

        $zip = "$(Agent.TempDirectory)\tflint.zip"
        $dir = "$(Agent.TempDirectory)\tflint"

        Invoke-WebRequest `
          -Uri $asset.browser_download_url `
          -OutFile $zip

        if (Test-Path $dir) {
          Remove-Item `
            $dir `
            -Recurse `
            -Force
        }

        Expand-Archive `
          -Path $zip `
          -DestinationPath $dir `
          -Force

        Write-Host "##vso[task.prependpath]$dir"

        & "$dir\tflint.exe" --version

      displayName: 'Install TFLint'


    # ========================================================
    # RUN TFLINT
    # ========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        Write-Host "=========================================="
        Write-Host "Running TFLint"
        Write-Host "=========================================="

        tflint --init

        tflint

      displayName: 'Run TFLint'

      continueOnError: true


    # ========================================================
    # INSTALL CHECKOV
    # ========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "Installing Checkov"
        Write-Host "=========================================="

        python -m pip install --upgrade pip

        python -m pip install checkov

        Write-Host "Checkov installation completed."

      displayName: 'Install Checkov'


    # ========================================================
    # RUN CHECKOV
    # ========================================================

    - powershell: |

        $ErrorActionPreference = "Continue"

        $reportDirectory = "$(Build.ArtifactStagingDirectory)\security"

        $checkovReport = "$reportDirectory\checkov.json"

        Write-Host "=========================================="
        Write-Host "Running Checkov"
        Write-Host "=========================================="

        Write-Host "Working directory:"
        Write-Host "$(workingDirectory)"

        Write-Host "Report directory:"
        Write-Host $reportDirectory

        Write-Host "Report:"
        Write-Host $checkovReport


        # ----------------------------------------------------
        # Create report directory
        # ----------------------------------------------------

        New-Item `
          -ItemType Directory `
          -Path $reportDirectory `
          -Force |
          Out-Null


        # ----------------------------------------------------
        # Remove previous report
        # ----------------------------------------------------

        if (Test-Path -LiteralPath $checkovReport) {

          Remove-Item `
            -LiteralPath $checkovReport `
            -Force `
            -ErrorAction SilentlyContinue
        }


        # ----------------------------------------------------
        # Run Checkov
        #
        # We intentionally capture JSON output ourselves.
        # This avoids the Windows output-file issue that was
        # producing a 1-byte report.
        # ----------------------------------------------------

        Set-Location "$(workingDirectory)"

        $checkovOutput = & checkov `
          -d "$(workingDirectory)" `
          --framework terraform `
          -o json `
          2>$null

        $checkovExitCode = $LASTEXITCODE

        Write-Host "Checkov exit code:"
        Write-Host $checkovExitCode


        # ----------------------------------------------------
        # Write JSON output to file
        # ----------------------------------------------------

        if ($null -eq $checkovOutput) {

          Write-Error "Checkov returned no output."

          exit 1
        }


        $checkovOutput |
          Out-File `
            -LiteralPath $checkovReport `
            -Encoding utf8 `
            -Force


        # ----------------------------------------------------
        # Verify report exists
        # ----------------------------------------------------

        if (-not (Test-Path -LiteralPath $checkovReport)) {

          Write-Error "Checkov report was not created."

          exit 1
        }


        # ----------------------------------------------------
        # Verify report size
        # ----------------------------------------------------

        $reportFile = Get-Item `
          -LiteralPath $checkovReport

        Write-Host "Checkov report size:"
        Write-Host "$($reportFile.Length) bytes"


        if ($reportFile.Length -lt 2) {

          Write-Error "Checkov generated an empty report."

          exit 1
        }


        # ----------------------------------------------------
        # Validate JSON
        # ----------------------------------------------------

        Write-Host "Validating Checkov JSON..."

        try {

          Get-Content `
            -LiteralPath $checkovReport `
            -Raw |
            ConvertFrom-Json |
            Out-Null

          Write-Host "Checkov JSON validation successful."

        }
        catch {

          Write-Error "Checkov generated invalid JSON."

          Write-Host "Report content:"
          Get-Content `
            -LiteralPath $checkovReport `
            -Raw

          exit 1
        }


        Write-Host "=========================================="
        Write-Host "Checkov report successfully created"
        Write-Host "=========================================="

        Write-Host "Report:"
        Write-Host $checkovReport

        Write-Host "Size:"
        Write-Host "$($reportFile.Length) bytes"


        # ----------------------------------------------------
        # Checkov findings should not block pipeline.
        #
        # Exit code 0 = no findings
        # Exit code 1 = findings
        #
        # Both are acceptable for this security stage.
        # ----------------------------------------------------

        if ($checkovExitCode -eq 0) {

          Write-Host "Checkov completed with no blocking findings."

        }
        elseif ($checkovExitCode -eq 1) {

          Write-Warning "Checkov found security findings."

        }
        else {

          Write-Error `
            "Checkov execution failed with unexpected exit code: $checkovExitCode"

          exit $checkovExitCode
        }

      displayName: 'Run Checkov'

      continueOnError: true


    # ========================================================
    # PUBLISH CHECKOV REPORT
    # ========================================================

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Checkov Report'

      inputs:

        PathtoPublish: '$(Build.ArtifactStagingDirectory)\security'

        ArtifactName: 'security-report'

        publishLocation: 'Container'


# ============================================================
# STAGE 3 - TERRAFORM PLAN
# ============================================================

- stage: Terraform_Plan
  displayName: 'Terraform Plan'

  dependsOn:
    - Terraform_CI
    - Security_Scan

  # ----------------------------------------------------------
  # Security findings should NOT prevent Terraform Plan.
  #
  # Terraform CI must still be successful.
  # ----------------------------------------------------------

  condition: |
    and(
      always(),
      eq(
        dependencies.Terraform_CI.result,
        'Succeeded'
      )
    )

  jobs:

  - job: Plan
    displayName: 'Terraform Plan'

    steps:

    - checkout: self


    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'

      inputs:
        terraformVersion: $(terraformVersion)


    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - powershell: |

        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        Write-Host "=========================================="
        Write-Host "Terraform Init"
        Write-Host "=========================================="

        terraform init

      displayName: 'Terraform Init'


    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------

    - powershell: |

        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        $planDirectory = `
          "$(Build.ArtifactStagingDirectory)\terraform"

        New-Item `
          -ItemType Directory `
          -Force `
          -Path $planDirectory |
          Out-Null

        Write-Host "=========================================="
        Write-Host "Creating Terraform Plan"
        Write-Host "=========================================="

        terraform plan `
          -out="$planDirectory\tfplan"

      displayName: 'Terraform Plan'


    # --------------------------------------------------------
    # EXPORT TERRAFORM PLAN
    # --------------------------------------------------------

    - powershell: |

        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        $planFile = `
          "$(Build.ArtifactStagingDirectory)\terraform\tfplan"

        $planText = `
          "$(Build.ArtifactStagingDirectory)\terraform\terraform-plan.txt"

        Write-Host "=========================================="
        Write-Host "Exporting Terraform Plan"
        Write-Host "=========================================="

        terraform show `
          -no-color `
          "$planFile" |
          Out-File `
            -FilePath "$planText" `
            -Encoding utf8 `
            -Force

        Write-Host "Terraform plan exported."

      displayName: 'Export Terraform Plan'


    # --------------------------------------------------------
    # PUBLISH TERRAFORM PLAN
    # --------------------------------------------------------

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Terraform Plan'

      inputs:

        PathtoPublish: '$(Build.ArtifactStagingDirectory)\terraform'

        ArtifactName: 'terraform-plan'

        publishLocation: 'Container'


# ============================================================
# STAGE 4 - AI SECURITY REVIEW
# ============================================================

- stage: AI_Security_Review
  displayName: 'AI Security Review'

  dependsOn:
    - Security_Scan

  condition: |
    and(
      always(),
      not(canceled())
    )

  jobs:

  - job: AIReview
    displayName: 'Review Checkov Findings with AI'

    pool:
      name: Agentic-AI-POOL

    steps:

    - checkout: self


    # ========================================================
    # DOWNLOAD CHECKOV REPORT
    # ========================================================

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Checkov Report'

      inputs:

        buildType: 'current'

        downloadType: 'single'

        artifactName: 'security-report'

        downloadPath: '$(Pipeline.Workspace)'


    # ========================================================
    # INSTALL PYTHON / AZURE AI SDK
    # ========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "Installing Azure AI Projects SDK"
        Write-Host "=========================================="

        python --version

        python -m pip install --upgrade pip

        python -m pip install "azure-ai-projects>=2.3.0"

        Write-Host "Azure AI Projects SDK installed."

      displayName: 'Install Azure AI SDK'


    # ========================================================
    # VERIFY CHECKOV REPORT
    # ========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        $report = `
          "$(Pipeline.Workspace)\security-report\checkov.json"

        Write-Host "=========================================="
        Write-Host "Verify Checkov Report"
        Write-Host "=========================================="

        Write-Host "Expected report:"
        Write-Host $report


        # ----------------------------------------------------
        # Check file
        # ----------------------------------------------------

        if (-not (Test-Path -LiteralPath $report)) {

          Write-Error "Checkov report not found."

          Write-Host "Available files:"

          Get-ChildItem `
            "$(Pipeline.Workspace)\security-report" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length

          exit 1
        }


        # ----------------------------------------------------
        # Check file size
        # ----------------------------------------------------

        $reportFile = Get-Item `
          -LiteralPath $report

        Write-Host "Report size:"
        Write-Host "$($reportFile.Length) bytes"


        if ($reportFile.Length -lt 2) {

          Write-Error `
            "Checkov report is empty or only 1 byte."

          exit 1
        }


        # ----------------------------------------------------
        # Validate JSON
        # ----------------------------------------------------

        Write-Host "Validating Checkov JSON..."

        try {

          $json = Get-Content `
            -LiteralPath $report `
            -Raw `
            -ErrorAction Stop |
            ConvertFrom-Json

          Write-Host "Checkov JSON validation successful."

        }
        catch {

          Write-Error `
            "Checkov report is not valid JSON: $($_.Exception.Message)"

          Write-Host "Report content:"

          Get-Content `
            -LiteralPath $report `
            -Raw `
            -ErrorAction SilentlyContinue

          exit 1
        }


        Write-Host "Checkov report is ready for AI review."

      displayName: 'Verify Checkov Report'


    # ========================================================
    # PREPARE CHECKOV REPORT FOR AI
    #
    # IMPORTANT:
    # No icacls.
    # No /grant:r.
    # No Windows permission modification.
    #
    # We simply copy the verified JSON into the agent temp
    # directory and validate it again.
    # ========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        $source = `
          "$(Pipeline.Workspace)\security-report\checkov.json"

        $destination = `
          "$(Agent.TempDirectory)\checkov-ai.json"

        Write-Host "=========================================="
        Write-Host "Preparing Checkov Report for AI"
        Write-Host "=========================================="

        Write-Host "Source:"
        Write-Host $source

        Write-Host "Destination:"
        Write-Host $destination


        # ----------------------------------------------------
        # Verify source
        # ----------------------------------------------------

        if (-not (Test-Path -LiteralPath $source)) {

          Write-Error "Source Checkov report does not exist."

          exit 1
        }


        # ----------------------------------------------------
        # Source size
        # ----------------------------------------------------

        $sourceFile = Get-Item `
          -LiteralPath $source

        Write-Host "Source size:"
        Write-Host "$($sourceFile.Length) bytes"


        if ($sourceFile.Length -lt 2) {

          Write-Error "Source Checkov report is empty."

          exit 1
        }


        # ----------------------------------------------------
        # Remove old destination
        # ----------------------------------------------------

        if (Test-Path -LiteralPath $destination) {

          Remove-Item `
            -LiteralPath $destination `
            -Force `
            -ErrorAction SilentlyContinue
        }


        # ----------------------------------------------------
        # Copy report
        # ----------------------------------------------------

        Copy-Item `
          -LiteralPath $source `
          -Destination $destination `
          -Force


        # ----------------------------------------------------
        # Verify destination
        # ----------------------------------------------------

        if (-not (Test-Path -LiteralPath $destination)) {

          Write-Error `
            "Failed to create AI Checkov report."

          exit 1
        }


        $destinationFile = Get-Item `
          -LiteralPath $destination

        Write-Host "Destination size:"
        Write-Host "$($destinationFile.Length) bytes"


        if ($destinationFile.Length -lt 2) {

          Write-Error `
            "AI Checkov report is empty."

          exit 1
        }


        # ----------------------------------------------------
        # Validate copied JSON
        # ----------------------------------------------------

        try {

          Get-Content `
            -LiteralPath $destination `
            -Raw |
            ConvertFrom-Json |
            Out-Null

          Write-Host "AI Checkov JSON validation successful."

        }
        catch {

          Write-Error `
            "Copied Checkov report is invalid JSON."

          exit 1
        }


        Write-Host "=========================================="
        Write-Host "Checkov report ready for AI"
        Write-Host "=========================================="

      displayName: 'Prepare Checkov Report for AI'


    # ========================================================
    # CALL MICROSOFT FOUNDRY AGENT
    # ========================================================

    - task: AzureCLI@2

      displayName: 'Run Terraform Security AI Review'

      inputs:

        azureSubscription: 'Agentic-AI-Service_connection'

        scriptType: 'ps'

        scriptLocation: 'inlineScript'

        inlineScript: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Microsoft Foundry AI Security Review"
          Write-Host "=========================================="

          $report = `
            "$(Agent.TempDirectory)\checkov-ai.json"

          Write-Host "Checkov report:"
          Write-Host $report


          # --------------------------------------------------
          # Verify report before Python
          # --------------------------------------------------

          if (-not (Test-Path -LiteralPath $report)) {

            Write-Error `
              "AI Checkov report not found."

            exit 1
          }


          $reportFile = Get-Item `
            -LiteralPath $report

          Write-Host "AI report size:"
          Write-Host "$($reportFile.Length) bytes"


          if ($reportFile.Length -lt 2) {

            Write-Error `
              "AI Checkov report is empty."

            exit 1
          }


          # --------------------------------------------------
          # Create Python script
          # --------------------------------------------------

          @'
          import json
          import os

          from azure.identity import DefaultAzureCredential
          from azure.ai.projects import AIProjectClient


          # ==================================================
          # CONFIGURATION
          # ==================================================

          endpoint = os.environ["FOUNDRY_PROJECT_ENDPOINT"]

          agent_name = os.environ["FOUNDRY_AGENT_NAME"]

          agent_version = os.environ["FOUNDRY_AGENT_VERSION"]

          report_path = os.environ["CHECKOV_REPORT"]


          # ==================================================
          # READ CHECKOV REPORT
          # ==================================================

          print("Reading Checkov report:")

          print(report_path)


          with open(
              report_path,
              "r",
              encoding="utf-8-sig"
          ) as f:

              checkov_report = json.load(f)


          print("Checkov report loaded successfully.")


          # ==================================================
          # BUILD AI PROMPT
          # ==================================================

          prompt = f"""
          You are an Azure DevOps and Terraform Security Reviewer.

          Analyze the Checkov security scan from an Azure DevOps
          Terraform CI/CD pipeline.

          Review the findings carefully.

          For each important finding provide:

          1. Checkov rule ID
          2. Severity
          3. Resource affected
          4. Why Checkov failed
          5. Root cause
          6. Security risk
          7. Correct Terraform remediation
          8. Exact Terraform code where possible
          9. Whether the fix belongs inside a module,
             root configuration, or separate module
          10. Validation commands
          11. Whether it appears to be a false positive
              or requires an approved exception

          Prioritize:

          - CRITICAL
          - HIGH
          - MEDIUM

          Do not invent:

          - Terraform resources
          - variables
          - modules
          - IDs
          - resource names

          that are not present in the supplied data.

          Clearly distinguish confirmed information from assumptions.

          If the finding contains insufficient Terraform context,
          explicitly say what additional Terraform information
          is required.

          Checkov report:

          {json.dumps(checkov_report, indent=2)}
          """


          # ==================================================
          # AZURE AUTHENTICATION
          # ==================================================

          print("Creating Azure credential...")

          credential = DefaultAzureCredential()


          # ==================================================
          # FOUNDRY PROJECT CLIENT
          # ==================================================

          print("Creating Microsoft Foundry project client...")

          project_client = AIProjectClient(
              endpoint=endpoint,
              credential=credential,
          )


          # ==================================================
          # OPENAI CLIENT
          # ==================================================

          print("Getting OpenAI client...")

          openai_client = project_client.get_openai_client()


          # ==================================================
          # CALL TERRAFORM SECURITY REVIEWER
          # ==================================================

          print("Calling Terraform-Security-Reviewer agent...")

          response = openai_client.responses.create(

              input=[
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],

              extra_body={
                  "agent_reference": {
                      "name": agent_name,
                      "version": agent_version,
                      "type": "agent_reference"
                  }
              },
          )


          # ==================================================
          # PRINT RESULT
          # ==================================================

          print("")
          print("==========================================")
          print("AI SECURITY REVIEW RESULT")
          print("==========================================")

          print(response.output_text)

          print("==========================================")
          print("AI SECURITY REVIEW COMPLETED")
          print("==========================================")


          '@ | Out-File `
              -FilePath "$(Agent.TempDirectory)\ai_review.py" `
              -Encoding utf8


          # --------------------------------------------------
          # Execute AI reviewer
          # --------------------------------------------------

          Write-Host "=========================================="
          Write-Host "Executing AI reviewer"
          Write-Host "=========================================="

          python "$(Agent.TempDirectory)\ai_review.py"

          if ($LASTEXITCODE -ne 0) {

            Write-Error `
              "Terraform Security AI Review failed."

            exit $LASTEXITCODE
          }

          Write-Host "=========================================="
          Write-Host "Terraform Security AI Review completed"
          Write-Host "=========================================="

      env:

        FOUNDRY_PROJECT_ENDPOINT: 'https://foundry-agentic-ai-dev-new.services.ai.azure.com/api/projects/proj-agentic-ai'

        FOUNDRY_AGENT_NAME: 'Terraform-Security-Reviewer'

        FOUNDRY_AGENT_VERSION: '2'

        CHECKOV_REPORT: '$(Agent.TempDirectory)\checkov-ai.json'