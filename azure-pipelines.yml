trigger:
- main

pool:
  name: Agentic-AI-POOL

variables:
  terraformVersion: '1.14.0'
  azureServiceConnection: 'Agentic-AI-Service_connection'
  workingDirectory: '$(Build.SourcesDirectory)\environments\dev'
  foundryEndpoint: 'https://foundry-agentic-ai-dev-new.services.ai.azure.com/api/projects/proj-agentic-ai'
  foundryAgentName: 'Terraform-Security-Reviewer'
  foundryAgentVersion: '2'

stages:

# ============================================================
# 1. TERRAFORM CI - KEEPING EXISTING WORKING FLOW
# ============================================================
- stage: Terraform_CI
  displayName: 'Terraform CI'
  jobs:
  - job: Terraform_Validate
    displayName: 'Terraform Validate'
    steps:
    - checkout: self
      displayName: 'Checkout Repository'
    - powershell: |
        $ErrorActionPreference = "Stop"
        $terraformUrl = "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_windows_amd64.zip"
        $zipFile = "$(Agent.TempDirectory)\terraform.zip"
        $terraformDir = "$(Agent.TempDirectory)\terraform"
        Invoke-WebRequest -Uri $terraformUrl -OutFile $zipFile
        if (Test-Path $terraformDir) { Remove-Item $terraformDir -Recurse -Force }
        New-Item -ItemType Directory -Path $terraformDir -Force | Out-Null
        Expand-Archive -Path $zipFile -DestinationPath $terraformDir -Force
        Write-Host "##vso[task.prependpath]$terraformDir"
        & "$terraformDir\terraform.exe" version
      displayName: 'Install Terraform'
    - powershell: |
        $ErrorActionPreference = "Stop"
        Set-Location "$(workingDirectory)"
        terraform init
        if ($LASTEXITCODE -ne 0) { Write-Error "Terraform init failed."; exit $LASTEXITCODE }
      displayName: 'Terraform Init'
    - powershell: |
        $ErrorActionPreference = "Stop"
        Set-Location "$(workingDirectory)"
        terraform validate
        if ($LASTEXITCODE -ne 0) { Write-Error "Terraform validate failed."; exit $LASTEXITCODE }
      displayName: 'Terraform Validate'

# ============================================================
# 2. CHECKOV SECURITY - KEEPING EXISTING WORKING FLOW
# ============================================================
- stage: Terraform_Security
  displayName: 'Terraform Security Scan'
  dependsOn:
  - Terraform_CI
  condition: succeeded()
  jobs:
  - job: Terraform_Security
    displayName: 'Terraform Security'
    steps:
    - checkout: self
      displayName: 'Checkout Repository'
    - powershell: |
        $ErrorActionPreference = "Stop"
        python --version
        python -m pip install --upgrade pip
        python -m pip install checkov
        checkov --version
      displayName: 'Install Checkov'
    - powershell: |
        $ErrorActionPreference = "Stop"
        $reportDirectory = "$(Pipeline.Workspace)\security-report"
        $reportFile = "$reportDirectory\checkov.json"
        if (Test-Path $reportDirectory) { Remove-Item $reportDirectory -Recurse -Force }
        New-Item -ItemType Directory -Path $reportDirectory -Force | Out-Null
        checkov -d "$(Build.SourcesDirectory)" --framework terraform --output json --output-file-path "$reportFile"
        $code = $LASTEXITCODE
        if (!(Test-Path $reportFile)) { Write-Error "Checkov report was not created."; exit 1 }
        if ((Get-Item $reportFile).Length -eq 0) { Write-Error "Checkov report is empty."; exit 1 }
        if ($code -ne 0) { Write-Warning "Checkov found security findings. AI review will analyze them." }
        exit 0
      displayName: 'Run Checkov'
    - powershell: |
        $reportFile = "$(Pipeline.Workspace)\security-report\checkov.json"
        if (!(Test-Path $reportFile)) { Write-Error "Checkov report not found."; exit 1 }
        Get-Item $reportFile | Format-List FullName,Length
      displayName: 'Verify Checkov Report'
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Checkov Report'
      inputs:
        targetPath: '$(Pipeline.Workspace)\security-report'
        artifact: 'CheckovReport'
        publishLocation: 'pipeline'

# ============================================================
# 3. TERRAFORM PLAN
# ============================================================
- stage: Terraform_Plan
  displayName: 'Terraform Plan'
  dependsOn:
  - Terraform_CI
  condition: succeeded()
  jobs:
  - job: Terraform_Plan
    displayName: 'Terraform Plan'
    steps:
    - checkout: self
      displayName: 'Checkout Repository'
    - powershell: |
        $ErrorActionPreference = "Stop"
        $terraformUrl = "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_windows_amd64.zip"
        $zipFile = "$(Agent.TempDirectory)\terraform.zip"
        $terraformDir = "$(Agent.TempDirectory)\terraform"
        Invoke-WebRequest -Uri $terraformUrl -OutFile $zipFile
        if (Test-Path $terraformDir) { Remove-Item $terraformDir -Recurse -Force }
        New-Item -ItemType Directory -Path $terraformDir -Force | Out-Null
        Expand-Archive -Path $zipFile -DestinationPath $terraformDir -Force
        Write-Host "##vso[task.prependpath]$terraformDir"
        terraform version
      displayName: 'Install Terraform'
    - powershell: |
        $ErrorActionPreference = "Stop"
        Set-Location "$(workingDirectory)"
        Write-Host "Working directory: $(workingDirectory)"
        Get-ChildItem -Filter "*.tf" | Select-Object Name,Length
        terraform init -input=false
        if ($LASTEXITCODE -ne 0) { Write-Error "Terraform init failed."; exit $LASTEXITCODE }
      displayName: 'Terraform Init'
    - powershell: |
        $ErrorActionPreference = "Stop"
        Set-Location "$(workingDirectory)"
        terraform validate
        if ($LASTEXITCODE -ne 0) { Write-Error "Terraform validate failed."; exit $LASTEXITCODE }
      displayName: 'Terraform Validate'
    - powershell: |
        $ErrorActionPreference = "Stop"
        Set-Location "$(workingDirectory)"
        $out = "$(Build.ArtifactStagingDirectory)\terraform"
        New-Item -ItemType Directory -Path $out -Force | Out-Null
        $plan = "$out\tfplan"
        terraform plan -input=false -out="$plan"
        if ($LASTEXITCODE -ne 0) { Write-Error "Terraform plan failed."; exit $LASTEXITCODE }
        if (!(Test-Path $plan)) { Write-Error "Terraform plan file was not created."; exit 1 }
      displayName: 'Terraform Plan'
    - powershell: |
        $ErrorActionPreference = "Stop"
        Set-Location "$(workingDirectory)"
        $plan = "$(Build.ArtifactStagingDirectory)\terraform\tfplan"
        $txt = "$(Build.ArtifactStagingDirectory)\terraform\terraform-plan.txt"
        terraform show -no-color "$plan" | Out-File -FilePath "$txt" -Encoding utf8
        if (!(Test-Path $txt)) { Write-Error "Terraform plan text was not created."; exit 1 }
      displayName: 'Export Terraform Plan'
    - powershell: |
        $ErrorActionPreference = "Stop"
        Set-Location "$(workingDirectory)"
        $plan = "$(Build.ArtifactStagingDirectory)\terraform\tfplan"
        $json = "$(Build.ArtifactStagingDirectory)\terraform\tfplan.json"
        $output = terraform show -json "$plan"
        if ($LASTEXITCODE -ne 0) { Write-Error "Terraform show JSON failed."; exit $LASTEXITCODE }
        if ([string]::IsNullOrWhiteSpace($output)) { Write-Error "Terraform Plan JSON is empty."; exit 1 }
        $output | Out-File -FilePath "$json" -Encoding utf8
        if (!(Test-Path $json) -or (Get-Item $json).Length -eq 0) { Write-Error "Terraform Plan JSON was not created or is empty."; exit 1 }
        Write-Host "Plan JSON: $json"
      displayName: 'Export Terraform Plan JSON'
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\terraform'
        artifact: 'TerraformPlan'
        publishLocation: 'pipeline'

# ============================================================
# 4. AGENTIC AI SECURITY REVIEW
# ============================================================
- stage: AI_Security_Review
  displayName: 'Agentic AI Security Review'
  dependsOn:
  - Terraform_Security
  - Terraform_Plan
  condition: |
    and(
      succeeded('Terraform_Security'),
      succeeded('Terraform_Plan')
    )
  jobs:
  - job: AIReview
    displayName: 'Review Terraform Plan with AI'
    steps:
    - checkout: self
      displayName: 'Checkout Repository'
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Checkov Report'
      inputs:
        buildType: 'current'
        artifactName: 'CheckovReport'
        targetPath: '$(Pipeline.Workspace)\CheckovReport'
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Terraform Plan'
      inputs:
        buildType: 'current'
        artifactName: 'TerraformPlan'
        targetPath: '$(Pipeline.Workspace)\TerraformPlan'
    - powershell: |
        $ErrorActionPreference = "Stop"
        $checkov = "$(Pipeline.Workspace)\CheckovReport\checkov.json"
        $plan = "$(Pipeline.Workspace)\TerraformPlan\tfplan.json"
        Write-Host "Checkov: $checkov"
        Write-Host "Plan JSON: $plan"
        if (!(Test-Path $checkov)) { Write-Error "Checkov report not found: $checkov"; exit 1 }
        if (!(Test-Path $plan)) { Write-Error "Terraform Plan JSON not found: $plan"; exit 1 }
        Write-Host "Checkov size: $((Get-Item $checkov).Length) bytes"
        Write-Host "Plan size: $((Get-Item $plan).Length) bytes"
      displayName: 'Verify AI Inputs'
    - powershell: |
        $ErrorActionPreference = "Stop"
        python --version
        python -m pip install --upgrade pip
        python -m pip install "azure-ai-projects>=2.1.0" azure-identity
      displayName: 'Install Azure AI SDK'
    - task: AzureCLI@2
      displayName: 'Run Terraform Security Agent'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          $ErrorActionPreference = "Stop"
          $pyPath = "$(Agent.TempDirectory)\terraform_ai_review.py"
          $b64 = ''
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($b64)) | Out-File -FilePath $pyPath -Encoding utf8
          $env:FOUNDRY_PROJECT_ENDPOINT = "$(foundryEndpoint)"
          $env:FOUNDRY_AGENT_NAME = "$(foundryAgentName)"
          $env:FOUNDRY_AGENT_VERSION = "$(foundryAgentVersion)"
          $env:CHECKOV_REPORT = "$(Pipeline.Workspace)\CheckovReport\checkov.json"
          $env:TERRAFORM_PLAN_JSON = "$(Pipeline.Workspace)\TerraformPlan\tfplan.json"
          Write-Host "Executing Terraform Security Reviewer..."
          python $pyPath
          if ($LASTEXITCODE -ne 0) { Write-Error "Agentic AI Security Review failed."; exit $LASTEXITCODE }