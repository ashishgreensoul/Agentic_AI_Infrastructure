trigger:
- main

pool:
  name: Agentic-AI-POOL

variables:
  terraformVersion: '1.9.8'
  azureServiceConnection: 'Agentic-AI-Service_connection'

  foundryEndpoint: 'https://foundry-agentic-ai-dev-new.services.ai.azure.com/api/projects/proj-agentic-ai'
  foundryAgentName: 'Terraform-Security-Reviewer'
  foundryAgentVersion: '2'

stages:

# ============================================================
# 1. TERRAFORM CI
# ============================================================

- stage: Terraform_CI
  displayName: 'Terraform CI'

  jobs:
  - job: Terraform_Validate
    displayName: 'Terraform Validate'

    steps:

    - checkout: self
      displayName: 'Checkout Repository'

    - powershell: |
        Write-Host "Installing Terraform $(terraformVersion)..."

        $terraformUrl = "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_windows_amd64.zip"
        $zipFile = "$(Agent.TempDirectory)\terraform.zip"
        $terraformDir = "$(Agent.TempDirectory)\terraform"

        Invoke-WebRequest `
          -Uri $terraformUrl `
          -OutFile $zipFile

        if (Test-Path $terraformDir) {
            Remove-Item $terraformDir -Recurse -Force
        }

        New-Item -ItemType Directory -Path $terraformDir -Force | Out-Null

        Expand-Archive `
          -Path $zipFile `
          -DestinationPath $terraformDir `
          -Force

        Write-Host "##vso[task.prependpath]$terraformDir"

        & "$terraformDir\terraform.exe" version

      displayName: 'Install Terraform'

    - powershell: |
        terraform init

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform init failed."
            exit 1
        }

      displayName: 'Terraform Init'

    - powershell: |
        terraform validate

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform validate failed."
            exit 1
        }

      displayName: 'Terraform Validate'


# ============================================================
# 2. CHECKOV SECURITY SCAN
# ============================================================

- stage: Terraform_Security
  displayName: 'Terraform Security Scan'

  dependsOn:
  - Terraform_CI

  condition: succeeded()

  jobs:
  - job: Terraform_Security
    displayName: 'Terraform Security'

    steps:

    - checkout: self
      displayName: 'Checkout Repository'

    - powershell: |
        Write-Host "Installing Python..."

        python --version

        python -m pip install --upgrade pip

        python -m pip install checkov

        checkov --version

      displayName: 'Install Checkov'

    - powershell: |

        Write-Host "========================================"
        Write-Host "Running Checkov Security Scan"
        Write-Host "========================================"

        $reportDirectory = "$(Pipeline.Workspace)\security-report"
        $reportFile = "$reportDirectory\checkov.json"

        if (Test-Path $reportDirectory) {
            Remove-Item $reportDirectory -Recurse -Force
        }

        New-Item `
          -ItemType Directory `
          -Path $reportDirectory `
          -Force | Out-Null

        checkov `
          -d "$(Build.SourcesDirectory)" `
          --framework terraform `
          --output json `
          --output-file-path "$reportFile"

        $checkovExitCode = $LASTEXITCODE

        Write-Host "Checkov exit code: $checkovExitCode"

        if (!(Test-Path $reportFile)) {
            Write-Error "Checkov report was not created."
            exit 1
        }

        $fileSize = (Get-Item $reportFile).Length

        Write-Host "Checkov report size: $fileSize bytes"

        if ($fileSize -eq 0) {
            Write-Error "Checkov report is empty."
            exit 1
        }

        if ($checkovExitCode -ne 0) {
            Write-Warning "Checkov found security findings."
            Write-Host "Continuing pipeline so AI Security Reviewer can analyze them."
        }
        else {
            Write-Host "Checkov completed successfully."
        }

        exit 0

      displayName: 'Run Checkov'

    - powershell: |

        $reportFile = "$(Pipeline.Workspace)\security-report\checkov.json"

        Write-Host "Checking Checkov report..."

        if (!(Test-Path $reportFile)) {
            Write-Error "Checkov report not found."
            exit 1
        }

        Get-Item $reportFile | Format-List FullName,Length

        Write-Host "Checkov report is ready."

      displayName: 'Verify Checkov Report'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Checkov Report'
      inputs:
        targetPath: '$(Pipeline.Workspace)\security-report'
        artifact: 'CheckovReport'
        publishLocation: 'pipeline'


# ============================================================
# 3. TERRAFORM PLAN
# ============================================================

- stage: Terraform_Plan
  displayName: 'Terraform Plan'

  dependsOn:
  - Terraform_CI
  - Terraform_Security

  condition: succeeded()

  jobs:
  - job: Terraform_Plan
    displayName: 'Terraform Plan'

    steps:

    - checkout: self
      displayName: 'Checkout Repository'


    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "Installing Terraform"
        Write-Host "========================================"

        $terraformVersion = "$(terraformVersion)"

        $terraformUrl = "https://releases.hashicorp.com/terraform/$terraformVersion/terraform_${terraformVersion}_windows_amd64.zip"

        $zipFile = "$(Agent.TempDirectory)\terraform.zip"
        $terraformDir = "$(Agent.TempDirectory)\terraform"

        Invoke-WebRequest `
          -Uri $terraformUrl `
          -OutFile $zipFile

        if (Test-Path $terraformDir) {
            Remove-Item $terraformDir -Recurse -Force
        }

        New-Item `
          -ItemType Directory `
          -Path $terraformDir `
          -Force | Out-Null

        Expand-Archive `
          -Path $zipFile `
          -DestinationPath $terraformDir `
          -Force

        Write-Host "##vso[task.prependpath]$terraformDir"

        terraform version

      displayName: 'Install Terraform'


    # --------------------------------------------------------
    # Find Terraform Configuration
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "Finding Terraform Configuration"
        Write-Host "========================================"

        $repo = "$(Build.SourcesDirectory)"

        Write-Host "Repository:"
        Write-Host $repo

        Write-Host ""
        Write-Host "Terraform files found:"

        Get-ChildItem `
          -Path $repo `
          -Filter "*.tf" `
          -Recurse `
          -File |
          Select-Object FullName

        # ----------------------------------------------------
        # Prefer root directory if Terraform files exist there
        # ----------------------------------------------------

        $rootTfFiles = Get-ChildItem `
          -Path $repo `
          -Filter "*.tf" `
          -File

        if ($rootTfFiles.Count -gt 0) {

            $terraformWorkingDirectory = $repo

        }
        else {

            # ------------------------------------------------
            # Find directories containing main.tf
            # ------------------------------------------------

            $mainTf = Get-ChildItem `
              -Path $repo `
              -Filter "main.tf" `
              -Recurse `
              -File

            if ($mainTf.Count -eq 0) {

                Write-Error "No Terraform configuration found in repository."

                Write-Host ""
                Write-Host "Repository contents:"
                Get-ChildItem -Path $repo -Recurse -Directory |
                  Select-Object FullName

                exit 1
            }

            if ($mainTf.Count -gt 1) {

                Write-Warning "Multiple main.tf files found."

                $mainTf |
                  Select-Object FullName |
                  Format-Table
            }

            $terraformWorkingDirectory =
              $mainTf[0].Directory.FullName
        }

        Write-Host ""
        Write-Host "Terraform working directory:"
        Write-Host $terraformWorkingDirectory

        # Save for next steps
        Write-Host "##vso[task.setvariable variable=TerraformWorkingDirectory]$terraformWorkingDirectory"

      displayName: 'Locate Terraform Configuration'


    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "Terraform Init"
        Write-Host "========================================"

        Write-Host "Working directory:"
        Write-Host "$(TerraformWorkingDirectory)"

        Set-Location "$(Build.SourcesDirectory)\environments\dev"

        Get-ChildItem -Filter "*.tf"

        terraform init

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform init failed."
            exit 1
        }

      displayName: 'Terraform Init'


    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "Terraform Plan"
        Write-Host "========================================"

        Set-Location "$(Build.SourcesDirectory)\environments\dev"

        Write-Host "Current directory:"
        Get-Location

        Write-Host ""
        Write-Host "Terraform configuration:"
        Get-ChildItem -Filter "*.tf"

        $planFile = "$(Pipeline.Workspace)\tfplan"

        terraform plan `
          -out="$planFile"

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform plan failed."
            exit 1
        }

        Write-Host ""
        Write-Host "Terraform plan created successfully."

      displayName: 'Terraform Plan'


    # --------------------------------------------------------
    # Export Terraform Plan JSON
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "Export Terraform Plan JSON"
        Write-Host "========================================"

        $planFile = "$(Pipeline.Workspace)\tfplan"
        $jsonFile = "$(Pipeline.Workspace)\tfplan.json"

        terraform show `
          -json `
          "$planFile" `
          > "$jsonFile"

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform show failed."
            exit 1
        }

        if (!(Test-Path $jsonFile)) {
            Write-Error "Terraform plan JSON was not created."
            exit 1
        }

        $size = (Get-Item $jsonFile).Length

        Write-Host "Terraform plan JSON size: $size bytes"

        if ($size -eq 0) {
            Write-Error "Terraform plan JSON is empty."
            exit 1
        }

        Write-Host "Terraform plan JSON created successfully."

      displayName: 'Export Terraform Plan JSON'


    # --------------------------------------------------------
    # Publish Terraform Plan
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Pipeline.Workspace)\tfplan.json'
        artifact: 'TerraformPlan'
        publishLocation: 'pipeline'


# ============================================================
# 4. AI SECURITY + PLAN REVIEW
# ============================================================

- stage: AI_Security_Review
  displayName: 'AI Security Review'

  dependsOn:
  - Terraform_Security
  - Terraform_Plan

  condition: succeeded()

  jobs:
  - job: AI_Review
    displayName: 'Review Terraform with AI'

    steps:

    - checkout: self
      displayName: 'Checkout Repository'

    # --------------------------------------------------------
    # Download Checkov artifact from SAME pipeline run
    # --------------------------------------------------------

    - download: current
      artifact: CheckovReport
      displayName: 'Download Checkov Report'

    # --------------------------------------------------------
    # Download Terraform Plan from SAME pipeline run
    # --------------------------------------------------------

    - download: current
      artifact: TerraformPlan
      displayName: 'Download Terraform Plan'

    # --------------------------------------------------------
    # Verify both artifacts
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "Verifying AI Review Inputs"
        Write-Host "========================================"

        $checkovFile = "$(Pipeline.Workspace)\CheckovReport\checkov.json"
        $planFile = "$(Pipeline.Workspace)\TerraformPlan\tfplan.json"

        Write-Host "Checkov:"
        Write-Host $checkovFile

        if (!(Test-Path $checkovFile)) {
            Write-Error "Checkov artifact not found."
            exit 1
        }

        Write-Host "Terraform Plan:"
        Write-Host $planFile

        if (!(Test-Path $planFile)) {
            Write-Error "Terraform Plan artifact not found."
            exit 1
        }

        Write-Host ""
        Write-Host "Both artifacts are available."

      displayName: 'Verify AI Inputs'


    # --------------------------------------------------------
    # Call Microsoft Foundry Agent
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Run Terraform Security AI Review'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'

        inlineScript: |

          Write-Host "========================================"
          Write-Host "Microsoft Foundry Terraform AI Review"
          Write-Host "========================================"

          $checkovFile = "$(Pipeline.Workspace)\CheckovReport\checkov.json"
          $planFile = "$(Pipeline.Workspace)\TerraformPlan\tfplan.json"

          Write-Host ""
          Write-Host "Reading Checkov report..."

          $checkov = Get-Content `
            -Path $checkovFile `
            -Raw

          Write-Host "Reading Terraform plan..."

          $plan = Get-Content `
            -Path $planFile `
            -Raw

          # --------------------------------------------------
          # Protect against very large prompts
          # --------------------------------------------------

          $maxLength = 120000

          if ($checkov.Length -gt $maxLength) {
              Write-Warning "Checkov report is large. Truncating."
              $checkov = $checkov.Substring(0, $maxLength)
          }

          if ($plan.Length -gt $maxLength) {
              Write-Warning "Terraform plan is large. Truncating."
              $plan = $plan.Substring(0, $maxLength)
          }

          # --------------------------------------------------
          # AI instruction
          # --------------------------------------------------

          $prompt = "You are an Azure DevOps and Terraform Security Reviewer.`n`n"

          $prompt += "Review the Checkov report and Terraform plan.`n`n"

          $prompt += "Your responsibilities:`n"
          $prompt += "1. Identify Critical and High security findings.`n"
          $prompt += "2. Explain why each Checkov finding occurred.`n"
          $prompt += "3. Identify the Terraform root cause.`n"
          $prompt += "4. Provide the exact Terraform fix.`n"
          $prompt += "5. Explain whether the fix belongs inside the existing module or a separate module.`n"
          $prompt += "6. Review Terraform plan changes for security risks.`n"
          $prompt += "7. Review NSG, networking, public exposure, RBAC, identity, Key Vault, storage and encryption issues.`n"
          $prompt += "8. Do not invent resources that are not present.`n"
          $prompt += "9. Clearly separate actual findings from recommendations.`n"
          $prompt += "10. Provide practical Azure DevOps engineer actions.`n`n"

          $prompt += "Return the answer using these sections:`n"
          $prompt += "## Executive Summary`n"
          $prompt += "## Critical Findings`n"
          $prompt += "## High Findings`n"
          $prompt += "## Medium Findings`n"
          $prompt += "## Terraform Root Cause`n"
          $prompt += "## Recommended Terraform Fix`n"
          $prompt += "## Module Placement`n"
          $prompt += "## Terraform Plan Security Review`n"
          $prompt += "## Validation Commands`n"
          $prompt += "## Final Recommendation`n`n"

          $prompt += "================ CHECKOV REPORT ================`n"
          $prompt += $checkov
          $prompt += "`n`n================ TERRAFORM PLAN ================`n"
          $prompt += $plan

          # --------------------------------------------------
          # Create request JSON
          # --------------------------------------------------

          $request = @{
              input = @(
                  @{
                      role = "user"
                      content = $prompt
                  }
              )

              extra_body = @{
                  agent_reference = @{
                      name = "$(foundryAgentName)"
                      version = "$(foundryAgentVersion)"
                      type = "agent_reference"
                  }
              }
          }

          $requestBody = $request | ConvertTo-Json -Depth 20

          $requestFile = "$(Pipeline.Workspace)\foundry-request.json"
          $responseFile = "$(Pipeline.Workspace)\foundry-response.json"

          $requestBody | Set-Content `
            -Path $requestFile `
            -Encoding UTF8

          Write-Host ""
          Write-Host "Calling Foundry Agent..."
          Write-Host "Agent: $(foundryAgentName)"
          Write-Host "Version: $(foundryAgentVersion)"

          # --------------------------------------------------
          # Call Foundry
          # --------------------------------------------------

          az rest `
            --method post `
            --url "$(foundryEndpoint)/openai/v1/responses" `
            --resource "https://ai.azure.com" `
            --headers "Content-Type=application/json" `
            --body "@$requestFile" `
            --output json `
            > "$responseFile"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Foundry AI request failed."
              exit 1
          }

          if (!(Test-Path $responseFile)) {
              Write-Error "Foundry response was not created."
              exit 1
          }

          # --------------------------------------------------
          # Display AI response
          # --------------------------------------------------

          Write-Host ""
          Write-Host "========================================"
          Write-Host "AI SECURITY REVIEW"
          Write-Host "========================================"

          $response = Get-Content `
            -Path $responseFile `
            -Raw | ConvertFrom-Json

          if ($null -ne $response.output_text) {

              Write-Host $response.output_text

          }
          elseif ($null -ne $response.output) {

              Write-Host (
                $response.output |
                ConvertTo-Json -Depth 20
              )

          }
          else {

              Write-Host (
                $response |
                ConvertTo-Json -Depth 20
              )

          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "AI Review Completed"
          Write-Host "========================================"