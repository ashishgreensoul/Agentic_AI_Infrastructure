trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: Agentic-AI-POOL

variables:
  terraformVersion: '1.14.0'
  workingDirectory: 'environments/dev'

stages:

# ============================================================
# STAGE 1 - TERRAFORM CI
# ============================================================

- stage: Terraform_CI
  displayName: 'Terraform CI'

  jobs:
  - job: Validate
    displayName: 'Terraform Validate'

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: $(terraformVersion)

    # --------------------------------------------------------
    # Terraform Format
    # --------------------------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        Write-Host "Checking Terraform formatting..."

        terraform fmt -check -recursive

      displayName: 'Terraform Format Check'

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        Write-Host "Initializing Terraform..."

        terraform init -backend=false

      displayName: 'Terraform Init'

    # --------------------------------------------------------
    # Terraform Validate
    # --------------------------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        Write-Host "Validating Terraform..."

        terraform validate

      displayName: 'Terraform Validate'


# ============================================================
# STAGE 2 - SECURITY SCAN
# ============================================================

- stage: Security_Scan
  displayName: 'Terraform Security Scan'

  dependsOn:
    - Terraform_CI

  condition: succeeded()

  jobs:
  - job: Security
    displayName: 'Terraform Security'

    steps:

    - checkout: self

    # ========================================================
    # INSTALL TFLINT
    # ========================================================

    - powershell: |
        $ErrorActionPreference = "Stop"

        Write-Host "Downloading latest TFLint release..."

        $release = Invoke-RestMethod `
          -Uri "https://api.github.com/repos/terraform-linters/tflint/releases/latest"

        $asset = $release.assets |
          Where-Object {
            $_.name -eq "tflint_windows_amd64.zip"
          } |
          Select-Object -First 1

        if (-not $asset) {
          throw "TFLint Windows AMD64 package not found"
        }

        $zip = "$(Agent.TempDirectory)\tflint.zip"
        $dir = "$(Agent.TempDirectory)\tflint"

        Write-Host "Downloading: $($asset.browser_download_url)"

        Invoke-WebRequest `
          -Uri $asset.browser_download_url `
          -OutFile $zip

        if (Test-Path $dir) {
          Remove-Item $dir -Recurse -Force
        }

        Expand-Archive `
          -Path $zip `
          -DestinationPath $dir `
          -Force

        Write-Host "Adding TFLint to PATH..."

        Write-Host "##vso[task.prependpath]$dir"

        & "$dir\tflint.exe" --version

      displayName: 'Install TFLint'


    # ========================================================
    # RUN TFLINT
    # ========================================================

    - powershell: |
        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        Write-Host "Initializing TFLint..."

        tflint --init

        Write-Host "Running TFLint..."

        tflint

      displayName: 'Run TFLint'
      continueOnError: true


    # ========================================================
    # INSTALL & RUN CHECKOV
    # ========================================================

    - powershell: |
        $ErrorActionPreference = "Stop"

        Write-Host "Installing Checkov..."

        python -m pip install --upgrade pip
        python -m pip install checkov

        $securityDir = "$(Build.ArtifactStagingDirectory)\security"

        New-Item `
          -ItemType Directory `
          -Force `
          -Path $securityDir |
          Out-Null

        $checkovReport = "$securityDir\checkov.json"

        Write-Host "Running Checkov..."

        checkov `
          -d "$(workingDirectory)" `
          --framework terraform `
          -o json `
          --output-file-path $checkovReport

        if (-not (Test-Path $checkovReport)) {
          Write-Error "Checkov report was not created."
          exit 1
        }

        Write-Host "Checkov report created successfully."

        Get-Item $checkovReport |
          Format-List FullName,Length,LastWriteTime

      displayName: 'Run Checkov'
      continueOnError: true


    # ========================================================
    # PUBLISH CHECKOV REPORT
    # ========================================================

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Checkov Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)\security'
        ArtifactName: 'security-report'
        publishLocation: 'Container'


# ============================================================
# STAGE 3 - TERRAFORM PLAN
# ============================================================

- stage: Terraform_Plan
  displayName: 'Terraform Plan'

  dependsOn:
    - Terraform_CI
    - Security_Scan

  condition: |
    and(
      always(),
      eq(
        dependencies.Terraform_CI.result,
        'Succeeded'
      )
    )

  jobs:

  - job: Plan
    displayName: 'Terraform Plan'

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: $(terraformVersion)


    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        Write-Host "Initializing Terraform..."

        terraform init

      displayName: 'Terraform Init'


    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        $terraformDir = "$(Build.ArtifactStagingDirectory)\terraform"

        New-Item `
          -ItemType Directory `
          -Force `
          -Path $terraformDir |
          Out-Null

        Write-Host "Creating Terraform Plan..."

        terraform plan `
          -out="$terraformDir\tfplan"

      displayName: 'Terraform Plan'


    # --------------------------------------------------------
    # EXPORT TERRAFORM PLAN
    # --------------------------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        $terraformDir = "$(Build.ArtifactStagingDirectory)\terraform"

        terraform show `
          -no-color `
          "$terraformDir\tfplan" `
          > "$terraformDir\terraform-plan.txt"

        Write-Host "Terraform plan exported."

      displayName: 'Export Terraform Plan'


    # --------------------------------------------------------
    # PUBLISH TERRAFORM PLAN
    # --------------------------------------------------------

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Terraform Plan'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)\terraform'
        ArtifactName: 'terraform-plan'
        publishLocation: 'Container'


# ============================================================
# STAGE 4 - AI SECURITY REVIEW
# ============================================================

- stage: AI_Security_Review
  displayName: 'AI Security Review'

  dependsOn:
    - Security_Scan

  condition: |
    and(
      always(),
      not(canceled())
    )

  jobs:

  - job: AIReview
    displayName: 'Review Checkov Findings with AI'

    pool:
      name: Agentic-AI-POOL

    steps:

    - checkout: self

    # --------------------------------------------------------
    # DOWNLOAD CHECKOV REPORT
    # --------------------------------------------------------

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Checkov Report'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'security-report'
        downloadPath: '$(Pipeline.Workspace)'


    # --------------------------------------------------------
    # INSTALL PYTHON / AZURE AI SDK
    # --------------------------------------------------------

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "Installing Azure AI Projects SDK..."

        python -m pip install --upgrade pip

        python -m pip install "azure-ai-projects>=2.3.0"

        Write-Host "Azure AI Projects SDK installed."

      displayName: 'Install Azure AI SDK'


    # --------------------------------------------------------
    # VERIFY CHECKOV REPORT
    # --------------------------------------------------------

    - powershell: |

        $ErrorActionPreference = "Stop"

        $report = "$(Pipeline.Workspace)\security-report\checkov.json"

        Write-Host "Looking for Checkov report:"
        Write-Host $report

        if (-not (Test-Path -LiteralPath $report)) {

          Write-Error "Checkov report not found."

          Write-Host "Available files:"

          Get-ChildItem `
            "$(Pipeline.Workspace)" `
            -Recurse |
            Select-Object FullName

          exit 1
        }

        Write-Host "Checkov report found successfully."

        Get-Item -LiteralPath $report |
          Format-List FullName,Length,LastWriteTime

      displayName: 'Verify Checkov Report'


    # --------------------------------------------------------
    # PREPARE CHECKOV REPORT FOR AI
    #
    # IMPORTANT:
    # We do NOT let Python directly read the downloaded
    # artifact because the self-hosted Windows agent previously
    # returned PermissionError.
    #
    # We copy the report into the source directory and explicitly
    # grant the current agent user full control.
    # --------------------------------------------------------

    - powershell: |

        $ErrorActionPreference = "Stop"

        $source = "$(Pipeline.Workspace)\security-report\checkov.json"

        $destination = "$(Build.SourcesDirectory)\checkov-ai.json"

        Write-Host "=========================================="
        Write-Host "Preparing Checkov report for AI review"
        Write-Host "=========================================="

        Write-Host "Source:"
        Write-Host $source

        Write-Host "Destination:"
        Write-Host $destination


        # ------------------------------------------------------
        # Verify source
        # ------------------------------------------------------

        if (-not (Test-Path -LiteralPath $source)) {

          Write-Error "Source Checkov report does not exist."

          exit 1
        }

        Write-Host "Source Checkov report found."


        # ------------------------------------------------------
        # Remove old destination
        # ------------------------------------------------------

        if (Test-Path -LiteralPath $destination) {

          Write-Host "Removing existing AI report..."

          Remove-Item `
            -LiteralPath $destination `
            -Force `
            -ErrorAction SilentlyContinue
        }


        # ------------------------------------------------------
        # Copy report
        # ------------------------------------------------------

        Write-Host "Copying Checkov report..."

        Copy-Item `
          -LiteralPath $source `
          -Destination $destination `
          -Force


        # ------------------------------------------------------
        # Verify copy
        # ------------------------------------------------------

        if (-not (Test-Path -LiteralPath $destination)) {

          Write-Error "Failed to create AI Checkov report."

          exit 1
        }


        # ------------------------------------------------------
        # Grant permission to current Windows agent user
        # ------------------------------------------------------

        Write-Host "Applying Windows permissions..."

        icacls "$destination" `
          /grant:r "$env:USERNAME:(F)" `
          /c `
          /q


        # ------------------------------------------------------
        # Verify destination
        # ------------------------------------------------------

        $file = Get-Item -LiteralPath $destination

        Write-Host "AI Checkov report created successfully."

        Write-Host "Full Path:"
        Write-Host $file.FullName

        Write-Host "File Size:"
        Write-Host "$($file.Length) bytes"

        if ($file.Length -eq 0) {

          Write-Error "AI Checkov report is empty."

          exit 1
        }


        Write-Host "Checkov report is ready for AI review."

      displayName: 'Prepare Checkov Report for AI'


    # --------------------------------------------------------
    # CALL MICROSOFT FOUNDRY AGENT
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Run Terraform Security AI Review'

      inputs:

        azureSubscription: 'Agentic-AI-Service_connection'

        scriptType: 'ps'

        scriptLocation: 'inlineScript'

        inlineScript: |

          $ErrorActionPreference = "Stop"


          Write-Host "=========================================="
          Write-Host "Microsoft Foundry AI Security Review"
          Write-Host "=========================================="


          # --------------------------------------------------
          # IMPORTANT
          # Read the copied AI report.
          #
          # DO NOT read:
          # $(Pipeline.Workspace)\security-report\checkov.json
          #
          # The previous PermissionError happened on that path.
          # --------------------------------------------------

          $report = "$(Build.SourcesDirectory)\checkov-ai.json"

          Write-Host "AI Checkov report:"
          Write-Host $report


          if (-not (Test-Path -LiteralPath $report)) {

            Write-Error "AI Checkov report not found."

            exit 1
          }


          $file = Get-Item -LiteralPath $report

          Write-Host "AI Checkov report exists."

          Write-Host "Full Path:"
          Write-Host $file.FullName

          Write-Host "Size:"
          Write-Host "$($file.Length) bytes"


          # --------------------------------------------------
          # Create Python script
          # --------------------------------------------------

          @'
          import json
          import os
          import time

          from azure.identity import DefaultAzureCredential
          from azure.ai.projects import AIProjectClient


          # ==================================================
          # CONFIGURATION
          # ==================================================

          endpoint = os.environ["FOUNDRY_PROJECT_ENDPOINT"]

          agent_name = os.environ["FOUNDRY_AGENT_NAME"]

          agent_version = os.environ["FOUNDRY_AGENT_VERSION"]

          report_path = os.environ["CHECKOV_REPORT"]


          print("==========================================")
          print("Terraform Security AI Review")
          print("==========================================")

          print(f"Checkov report path: {report_path}")


          # ==================================================
          # VERIFY REPORT
          # ==================================================

          if not os.path.exists(report_path):

              raise FileNotFoundError(
                  f"Checkov report not found: {report_path}"
              )


          report_size = os.path.getsize(report_path)

          print(
              f"Checkov report size: "
              f"{report_size} bytes"
          )


          if report_size == 0:

              raise RuntimeError(
                  "Checkov report is empty."
              )


          # ==================================================
          # READ CHECKOV REPORT
          #
          # Retry is included because this is a Windows
          # self-hosted agent and files can occasionally be
          # temporarily locked.
          # ==================================================

          checkov_report = None


          for attempt in range(1, 6):

              try:

                  print(
                      f"Reading Checkov report "
                      f"(attempt {attempt}/5)..."
                  )


                  with open(
                      report_path,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      checkov_report = json.load(f)


                  print(
                      "Checkov report loaded successfully."
                  )


                  break


              except PermissionError as exc:

                  print(
                      f"Permission denied on attempt "
                      f"{attempt}: {exc}"
                  )


                  if attempt == 5:

                      raise


                  time.sleep(2)


          if checkov_report is None:

              raise RuntimeError(
                  "Unable to load Checkov report."
              )


          # ==================================================
          # BUILD AI PROMPT
          # ==================================================

          prompt = f"""
          You are an Azure DevOps and Terraform Security Reviewer.

          Analyze the Checkov security scan from an Azure DevOps
          Terraform CI/CD pipeline.

          Review the findings carefully.

          For each important finding provide:

          1. Checkov rule ID
          2. Severity
          3. Resource affected
          4. Why Checkov failed
          5. Root cause
          6. Security risk
          7. Correct Terraform remediation
          8. Exact Terraform code where possible
          9. Whether the fix belongs inside a module,
             root configuration, or separate module
          10. Validation commands
          11. Whether it appears to be a false positive
              or requires an approved exception

          Prioritize:

          - CRITICAL
          - HIGH
          - MEDIUM

          Do not invent resources, variables, modules,
          or IDs that are not present in the supplied data.

          Clearly distinguish confirmed information from assumptions.

          If the report contains multiple findings,
          review each important finding separately.

          Checkov report:

          {json.dumps(checkov_report, indent=2)}
          """


          # ==================================================
          # AZURE AUTHENTICATION
          # ==================================================

          print("Creating DefaultAzureCredential...")

          credential = DefaultAzureCredential()


          # ==================================================
          # FOUNDRY PROJECT CLIENT
          # ==================================================

          print("Creating Foundry project client...")


          project_client = AIProjectClient(

              endpoint=endpoint,

              credential=credential,
          )


          # ==================================================
          # GET OPENAI CLIENT
          # ==================================================

          print("Getting OpenAI client...")


          openai_client = (
              project_client.get_openai_client()
          )


          # ==================================================
          # CALL TERRAFORM SECURITY REVIEWER AGENT
          # ==================================================

          print(
              f"Calling Foundry agent: "
              f"{agent_name} "
              f"version {agent_version}"
          )


          response = openai_client.responses.create(

              input=[
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],

              extra_body={

                  "agent_reference": {

                      "name": agent_name,

                      "version": agent_version,

                      "type": "agent_reference"
                  }
              },
          )


          # ==================================================
          # PRINT AI RESULT
          # ==================================================

          print("")

          print("==========================================")

          print("AI SECURITY REVIEW RESULT")

          print("==========================================")


          print(response.output_text)


          print("")

          print("==========================================")

          print("AI SECURITY REVIEW COMPLETED")

          print("==========================================")


          '@ | Out-File `
              -FilePath "$(Agent.TempDirectory)\ai_review.py" `
              -Encoding utf8 `
              -Force


          # --------------------------------------------------
          # Verify Python script
          # --------------------------------------------------

          if (-not (Test-Path "$(Agent.TempDirectory)\ai_review.py")) {

              Write-Error `
                "AI review Python script was not created."

              exit 1
          }


          Write-Host "Python AI review script created successfully."


          # --------------------------------------------------
          # Execute AI reviewer
          # --------------------------------------------------

          Write-Host "Starting Terraform Security AI Review..."


          python "$(Agent.TempDirectory)\ai_review.py"


          if ($LASTEXITCODE -ne 0) {

              Write-Error `
                "Terraform Security AI Review failed with exit code $LASTEXITCODE."

              exit $LASTEXITCODE
          }


          Write-Host ""
          Write-Host "Terraform Security AI Review completed successfully."


      env:

        FOUNDRY_PROJECT_ENDPOINT: 'https://foundry-agentic-ai-dev-new.services.ai.azure.com/api/projects/proj-agentic-ai'

        FOUNDRY_AGENT_NAME: 'Terraform-Security-Reviewer'

        FOUNDRY_AGENT_VERSION: '2'

        # IMPORTANT:
        # Python reads the copied report from the source directory.
        # It does NOT read the downloaded artifact directly.

        CHECKOV_REPORT: '$(Build.SourcesDirectory)\checkov-ai.json'