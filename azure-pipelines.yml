trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: Agentic-AI-POOL

variables:
  terraformVersion: '1.14.0'
  workingDirectory: 'environments/dev'

stages:

# ============================================================
# STAGE 1 - TERRAFORM CI
# ============================================================

- stage: Terraform_CI
  displayName: 'Terraform CI'

  jobs:
  - job: Validate
    displayName: 'Terraform Validate'

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: $(terraformVersion)

    # --------------------------------------------------------
    # Terraform Format
    # --------------------------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        Write-Host "Checking Terraform formatting..."

        terraform fmt -check -recursive

      displayName: 'Terraform Format Check'

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        Write-Host "Initializing Terraform..."

        terraform init -backend=false

      displayName: 'Terraform Init'

    # --------------------------------------------------------
    # Terraform Validate
    # --------------------------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        Write-Host "Validating Terraform..."

        terraform validate

      displayName: 'Terraform Validate'


# ============================================================
# STAGE 2 - SECURITY SCAN
# ============================================================

- stage: Security_Scan
  displayName: 'Terraform Security Scan'

  dependsOn:
    - Terraform_CI

  condition: succeeded()

  jobs:
  - job: Security
    displayName: 'Terraform Security'

    steps:

    - checkout: self


    # ========================================================
    # INSTALL TFLINT
    # ========================================================

    - powershell: |
        $ErrorActionPreference = "Stop"

        Write-Host "Downloading latest TFLint release..."

        $release = Invoke-RestMethod `
          -Uri "https://api.github.com/repos/terraform-linters/tflint/releases/latest"

        $asset = $release.assets |
          Where-Object {
            $_.name -eq "tflint_windows_amd64.zip"
          } |
          Select-Object -First 1

        if (-not $asset) {
          throw "TFLint Windows AMD64 package not found"
        }

        $zip = "$(Agent.TempDirectory)\tflint.zip"
        $dir = "$(Agent.TempDirectory)\tflint"

        Write-Host "Downloading: $($asset.browser_download_url)"

        Invoke-WebRequest `
          -Uri $asset.browser_download_url `
          -OutFile $zip

        if (Test-Path $dir) {
          Remove-Item $dir -Recurse -Force
        }

        Expand-Archive `
          -Path $zip `
          -DestinationPath $dir `
          -Force

        Write-Host "Adding TFLint to PATH..."

        Write-Host "##vso[task.prependpath]$dir"

        & "$dir\tflint.exe" --version

      displayName: 'Install TFLint'


    # ========================================================
    # RUN TFLINT
    # ========================================================

    - powershell: |
        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        Write-Host "Initializing TFLint..."

        tflint --init

        Write-Host "Running TFLint..."

        tflint

      displayName: 'Run TFLint'
      continueOnError: true


    # ========================================================
    # INSTALL & RUN CHECKOV
    # ========================================================

    - powershell: |
        $ErrorActionPreference = "Stop"

        Write-Host "Installing Checkov..."

        python -m pip install --upgrade pip
        python -m pip install checkov

        New-Item `
          -ItemType Directory `
          -Force `
          -Path "$(Build.ArtifactStagingDirectory)\security" |
          Out-Null

        Write-Host "Running Checkov..."

        checkov `
          -d "$(workingDirectory)" `
          --framework terraform `
          -o json `
          --output-file-path "$(Build.ArtifactStagingDirectory)\security\checkov.json"

      displayName: 'Run Checkov'
      continueOnError: true


    # ========================================================
    # PUBLISH CHECKOV REPORT
    # ========================================================

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Checkov Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)\security'
        ArtifactName: 'security-report'
        publishLocation: 'Container'


# ============================================================
# STAGE 3 - TERRAFORM PLAN
# ============================================================

- stage: Terraform_Plan
  displayName: 'Terraform Plan'

  dependsOn:
    - Terraform_CI
    - Security_Scan

  # Security findings should NOT prevent the Plan stage.
  # Terraform CI must still be successful.

  condition: |
    and(
      always(),
      eq(
        dependencies.Terraform_CI.result,
        'Succeeded'
      )
    )

  jobs:

  - job: Plan
    displayName: 'Terraform Plan'

    steps:

    - checkout: self


    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: $(terraformVersion)


    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        Write-Host "Initializing Terraform..."

        terraform init

      displayName: 'Terraform Init'


    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        New-Item `
          -ItemType Directory `
          -Force `
          -Path "$(Build.ArtifactStagingDirectory)\terraform" |
          Out-Null

        Write-Host "Creating Terraform Plan..."

        terraform plan `
          -out="$(Build.ArtifactStagingDirectory)\terraform\tfplan"

      displayName: 'Terraform Plan'


    # --------------------------------------------------------
    # EXPORT TERRAFORM PLAN
    # --------------------------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        Set-Location "$(workingDirectory)"

        terraform show `
          -no-color `
          "$(Build.ArtifactStagingDirectory)\terraform\tfplan" `
          > "$(Build.ArtifactStagingDirectory)\terraform\terraform-plan.txt"

        Write-Host "Terraform plan exported."

      displayName: 'Export Terraform Plan'


    # --------------------------------------------------------
    # PUBLISH TERRAFORM PLAN
    # --------------------------------------------------------

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Terraform Plan'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)\terraform'
        ArtifactName: 'terraform-plan'
        publishLocation: 'Container'