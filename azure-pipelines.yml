trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: Agentic-AI-POOL

variables:
  terraformVersion: '1.14.0'
  workingDirectory: 'environments/dev'

stages:

- stage: Terraform_CI
  displayName: 'Terraform CI'

  jobs:
  - job: Validate
    displayName: 'Terraform Validate'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: $(terraformVersion)

    - script: |
        cd $(workingDirectory)
        terraform fmt -check -recursive
      displayName: 'Terraform Format Check'

    - script: |
        cd $(workingDirectory)
        terraform init -backend=false
      displayName: 'Terraform Init'

    - script: |
        cd $(workingDirectory)
        terraform validate
      displayName: 'Terraform Validate'

- stage: Security_Scan
  displayName: 'Terraform Security Scan'
  dependsOn: Terraform_CI
  condition: succeeded()

  jobs:
  - job: Security
    displayName: 'Terraform Security'

    steps:

    - checkout: self

    - script: |
        curl -sSfL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      displayName: 'Install TFLint'

    - script: |
        cd $(workingDirectory)
        tflint --init
        tflint
      displayName: 'Run TFLint'

    - script: |
        pip install checkov
        checkov -d $(workingDirectory)
      displayName: 'Run Checkov'